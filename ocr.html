<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - AI Gemini Nhận Diện Size</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 4px); padding: 10px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 240px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 12px;
        }
        video, img#frozenImage {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        img#frozenImage { display: none; }
        
        .scan-guide {
            position: absolute; top: 15%; left: 5%; width: 90%; height: 70%;
            border: 2px dashed #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.35);
        }
        
        .btn-action {
            width: 100%; padding: 14px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-capture { background: #ff9800; margin-bottom: 10px; }
        .btn-save { background: #28a745; }
        
        #resultSelect {
            border: 2px solid #ff9800; background: #fff3e0; color: #e65100;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX --</option>
        </select>
    </div>

    <label>Căn tem vào khung rồi bấm AI ĐỌC:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="frozenImage" alt="Ảnh đã chụp">
        <div class="scan-guide" id="scanGuide"></div>
    </div>

    <button class="btn-action btn-capture" id="captureBtn" onclick="handleCaptureOrRetake()">🤖 AI ĐỌC TEM & ĐIỀN SIZE</button>

    <div class="form-group">
        <label>Cỡ x Giàng (AI tự nhận diện điền sẵn) *</label>
        <select id="resultSelect">
            <option value="">-- Vui lòng chọn Đơn hàng --</option>
        </select>
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'DÁN_URL_WEB_APP_CỦA_BẠN_VÀO_ĐÂY';
let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let isFrozen = false;
let capturedBase64 = "";

window.onload = async function() {
    initCamera();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang kết nối CSDL...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        
        renderSeasons();
        status.innerText = "🤖 Sẵn sàng! Căn tem và bấm AI Đọc.";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi kết nối CSDL!";
        status.style.color = "red";
    }
};

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {}
    }
}

function handleCaptureOrRetake() {
    if (!isFrozen) {
        captureAndSendToAI();
    } else {
        resetToCamera();
    }
}

function resetToCamera() {
    isFrozen = false;
    capturedBase64 = "";
    document.getElementById('webcam').style.display = 'block';
    document.getElementById('frozenImage').style.display = 'none';
    document.getElementById('scanGuide').style.display = 'block';
    
    const btn = document.getElementById('captureBtn');
    btn.innerText = "🤖 AI ĐỌC TEM & ĐIỀN SIZE";
    btn.style.background = "#ff9800";
    btn.style.color = "#fff";
    
    updateSizeDropdown(); 
    document.getElementById('status').innerText = "🤖 Sẵn sàng!";
    document.getElementById('status').style.color = "green";
}

function updateSizeDropdown(selectValue = "") {
    const currentDH = document.getElementById('donHangSelect').value;
    const selectRes = document.getElementById('resultSelect');
    selectRes.innerHTML = '';

    const item = rawStyleData.find(d => d.muaSX === selectedSeason && d.donHang === currentDH);
    const validList = item ? (item.danhSachCo || []) : [];

    if (validList.length === 0) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.innerText = "-- Không có dữ liệu size --";
        selectRes.appendChild(opt);
        return;
    }

    validList.forEach(size => {
        const opt = document.createElement('option');
        opt.value = size;
        opt.innerText = size;
        selectRes.appendChild(opt);
    });

    if (selectValue) {
        let matched = validList.find(v => v.toUpperCase().includes(selectValue.toUpperCase()));
        if (matched) {
            selectRes.value = matched;
        }
    }
}

async function captureAndSendToAI() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');
    const status = document.getElementById('status');

    if (video.videoWidth === 0) return;

    status.innerText = "⏳ AI đang phân tích hình ảnh tem áo...";
    status.style.color = "blue";

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    capturedBase64 = canvas.toDataURL('image/jpeg', 0.8);

    const frozenImg = document.getElementById('frozenImage');
    frozenImg.src = capturedBase64;
    video.style.display = 'none';
    frozenImg.style.display = 'block';
    document.getElementById('scanGuide').style.display = 'none';

    isFrozen = true;
    const btn = document.getElementById('captureBtn');
    btn.innerText = "🔄 CHỤP LẠI";
    btn.style.background = "#6c757d";
    btn.style.color = "#fff";

    const currentDH = document.getElementById('donHangSelect').value;

    try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "ai_scan",
                muaSX: selectedSeason, 
                donHang: currentDH, 
                image: capturedBase64 
            })
        });

        const resJson = await response.json();
        if (resJson.status === "success" && resJson.detected) {
            updateSizeDropdown(resJson.detected);
            status.innerText = "✨ AI đọc xong: " + resJson.detected + " (Kiểm tra lại rồi bấm Save)";
            status.style.color = "green";
        } else {
            status.innerText = "⚠️ AI không đọc rõ, hãy chọn thủ công bên dưới!";
            status.style.color = "orange";
        }

    } catch (e) {
        status.innerText = "❌ Lỗi kết nối AI! Hãy chọn thủ công.";
        status.style.color = "red";
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))].filter(Boolean);
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))].filter(Boolean);

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    updateSizeDropdown();
}

function onDonHangChange() {
    localStorage.setItem('saved_donhang', document.getElementById('donHangSelect').value);
    resetToCamera();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    const vanBan = document.getElementById('resultSelect').value;
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Vui lòng chọn Cỡ x Giàng!"); return; }

    status.innerText = "⏳ Đang lưu về CSDL...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "save",
                muaSX: selectedSeason, 
                donHang: donHang, 
                vanBan: vanBan, 
                image: "" 
            })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";

        setTimeout(() => {
            resetToCamera();
        }, 600);

    } catch (e) {
        status.innerText = "❌ Lỗi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>
</body>
</html>
