<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Chụp Ảnh Bóc Tách Cỡ</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px); padding: 10px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 210px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 12px;
        }
        video, img#frozenImage {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        img#frozenImage { display: none; }
        
        .scan-guide {
            position: absolute; top: 25%; left: 8%; width: 84%; height: 50%;
            border: 2px dashed #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.4);
        }
        
        .btn-action {
            width: 100%; padding: 14px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-capture { background: #17a2b8; margin-bottom: 10px; }
        .btn-save { background: #28a745; }
        
        #resultBox {
            width: 100%; height: 55px; padding: 10px; border: 2px solid #28a745;
            border-radius: 8px; font-size: 24px; font-weight: bold; color: #155724; background: #e8f8f5;
            text-align: center;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX --</option>
        </select>
    </div>

    <label>Căn dòng Cỡ x Giàng vào khung xanh:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="frozenImage" alt="Ảnh đã chụp">
        <div class="scan-guide" id="scanGuide"></div>
    </div>

    <button class="btn-action btn-capture" id="captureBtn" onclick="handleCaptureOrRetake()">📸 CHỤP ĐỂ BÓC TÁCH CỠ</button>

    <div class="form-group">
        <label>Cỡ x giàng tự động bóc tách *</label>
        <input type="text" id="resultBox" readonly placeholder="Bấm nút chụp để bóc tách cỡ...">
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';

let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let currentValidSizes = [];
let isFrozen = false;
let worker = null;

window.onload = async function() {
    initCamera();
    initTesseractWorker();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang kết nối CSDL...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "👀 Đã sẵn sàng chụp!";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi kết nối CSDL!";
        status.style.color = "red";
    }
};

async function initTesseractWorker() {
    try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
            tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ/ ',
        });
    } catch(e) {}
}

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {}
    }
}

function handleCaptureOrRetake() {
    const btn = document.getElementById('captureBtn');
    if (!isFrozen) {
        // Thực hiện BẮT ẢNH TĨNH & BÓC TÁCH
        captureAndProcess();
    } else {
        // Chụp lại
        resetToCamera();
    }
}

function resetToCamera() {
    isFrozen = false;
    document.getElementById('webcam').style.display = 'block';
    document.getElementById('frozenImage').style.display = 'none';
    document.getElementById('scanGuide').style.display = 'block';
    
    const btn = document.getElementById('captureBtn');
    btn.innerText = "📸 CHỤP ĐỂ BÓC TÁCH CỠ";
    btn.style.background = "#17a2b8";
    
    document.getElementById('resultBox').value = "";
    document.getElementById('status').innerText = "👀 Căn tem vào khung và bấm CHỤP";
    document.getElementById('status').style.color = "green";
}

function preprocessCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        let v = avg < 130 ? 0 : 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
}

function autoMatchExactSize(scannedText) {
    if (!currentValidSizes || currentValidSizes.length === 0) return scannedText;
    let cleanScanned = scannedText.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cleanScanned.length < 1) return scannedText;

    let bestMatch = scannedText;
    let maxMatchChars = 0;

    currentValidSizes.forEach(validSize => {
        let cleanValid = validSize.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let matched = 0;
        for (let char of cleanValid) {
            if (cleanScanned.includes(char)) matched++;
        }
        if (matched > maxMatchChars) {
            maxMatchChars = matched;
            bestMatch = validSize;
        }
    });

    return bestMatch;
}

async function captureAndProcess() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');
    const status = document.getElementById('status');

    if (video.videoWidth === 0) return;

    status.innerText = "⚡ Đang bóc tách Cỡ x Giàng...";
    status.style.color = "blue";

    // 1. Chụp cắt đúng ô vuông giữa
    const cropX = video.videoWidth * 0.08;
    const cropY = video.videoHeight * 0.25;
    const cropWidth = video.videoWidth * 0.84;
    const cropHeight = video.videoHeight * 0.50;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
    
    // Hiển thị ảnh đóng băng lên màn hình
    const frozenImg = document.getElementById('frozenImage');
    frozenImg.src = canvas.toDataURL('image/png');
    video.style.display = 'none';
    frozenImg.style.display = 'block';
    document.getElementById('scanGuide').style.display = 'none';

    isFrozen = true;
    const btn = document.getElementById('captureBtn');
    btn.innerText = "🔄 CHỤP LẠI (NẾU SAI)";
    btn.style.background = "#ffc107";
    btn.style.color = "#000";

    // Preprocess để OCR đọc cực nét
    preprocessCanvas(canvas);

    try {
        let text = "";
        if (worker) {
            const res = await worker.recognize(canvas);
            text = res.data.text || '';
        } else {
            const res = await Tesseract.recognize(canvas, 'eng');
            text = res.data.text || '';
        }

        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length >= 1);

        if (lines.length > 0) {
            let matchedSize = autoMatchExactSize(lines[0]);
            document.getElementById('resultBox').value = matchedSize;
            status.innerText = "✅ BÓC TÁCH THÀNH CÔNG! Bấm SAVE để lưu.";
            status.style.color = "green";
        } else {
            status.innerText = "⚠️ Không rõ chữ, vui lòng bấm CHỤP LẠI!";
            status.style.color = "orange";
        }
    } catch (e) {
        status.innerText = "❌ Lỗi xử lý ảnh!";
        status.style.color = "red";
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    select.onchange = function() {
        localStorage.setItem('saved_donhang', this.value);
        onDonHangChange();
    };

    onDonHangChange();
}

function onDonHangChange() {
    const donHang = document.getElementById('donHangSelect').value;
    const item = rawStyleData.find(i => i.donHang === donHang);
    if (item && item.danhSachCo) {
        currentValidSizes = item.danhSachCo;
    } else {
        currentValidSizes = [];
    }
    resetToCamera();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    let vanBan = document.getElementById('resultBox').value.trim();
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa có Cỡ x Giàng để lưu!"); return; }

    status.innerText = "⏳ Đang lưu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";

        setTimeout(() => {
            resetToCamera();
        }, 800);

    } catch (e) {
        status.innerText = "❌ Lỗi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
