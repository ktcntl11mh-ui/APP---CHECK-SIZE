<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Quét OCR Tự Động 100%</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px); padding: 12px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 210px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 12px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute; top: 25%; left: 8%; width: 84%; height: 50%;
            border: 3px dashed #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.35);
        }
        .live-preview-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-weight: bold;
            font-size: 22px; text-shadow: 1px 1px 3px #000; background: rgba(0,0,0,0.8);
            padding: 10px 4px; min-height: 45px;
        }
        .btn-action {
            width: 100%; padding: 15px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-save { background: #28a745; margin-top: 10px; }
        #resultBox {
            width: 100%; height: 60px; padding: 10px; border: 2px solid #28a745;
            border-radius: 8px; font-size: 24px; font-weight: bold; color: #155724; background: #e8f8f5;
            text-align: center;
        }
        #status { margin-top: 12px; text-align: center; font-weight: bold; font-size: 16px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải Mùa SX...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX trước --</option>
        </select>
    </div>

    <label>Rọi camera vào dòng Cỡ x Giàng:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
        <div class="live-preview-text" id="livePreview">👀 Đang quét tìm cỡ chuẩn...</div>
    </div>

    <div class="form-group">
        <label>Cỡ x giàng tự động khớp chuẩn *</label>
        <input type="text" id="resultBox" readonly placeholder="Hệ thống tự động trả về cỡ chuẩn...">
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';

let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let currentValidSizes = [];
let isScanning = true;
let scanInterval = null;

window.onload = async function() {
    initCamera();
    startAutoScan();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang kết nối CSDL...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "⚡ Camera đang tự động lọc cỡ chuẩn...";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi tải CSDL!";
        status.style.color = "red";
    }
};

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {
            document.getElementById('status').innerText = "⚠️ Mở bằng Safari/Chrome để bật Camera!";
            document.getElementById('status').style.color = "orange";
        }
    }
}

function startAutoScan() {
    isScanning = true;
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(captureAndAnalyze, 600); // Quét siêu nhanh 0.6s
}

function resetScanState() {
    document.getElementById('resultBox').value = '';
    document.getElementById('livePreview').innerText = "👀 Đang quét tìm cỡ chuẩn...";
    document.getElementById('status').innerText = "⚡ Camera đang tự động lọc cỡ chuẩn...";
    document.getElementById('status').style.color = "green";
    startAutoScan();
}

function preprocessCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        let v = avg < 135 ? 0 : 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
}

// Hàm tính khoảng cách chuỗi (Levenshtein Distance) để lọc chính xác 100%
function getLevenshteinDistance(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// Ép dòng quét được khớp tự động chính xác với danh sách DS-SIZE
function autoMatchExactSize(scannedText) {
    if (!currentValidSizes || currentValidSizes.length === 0) return null;
    
    let cleanScanned = scannedText.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cleanScanned.length < 2) return null;

    let bestMatch = null;
    let minDistance = 999;

    currentValidSizes.forEach(validSize => {
        let cleanValid = validSize.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let dist = getLevenshteinDistance(cleanScanned, cleanValid);

        if (dist < minDistance) {
            minDistance = dist;
            bestMatch = validSize;
        }
    });

    // Chỉ chấp nhận nếu độ sai lệch nhỏ (Khớp chính xác cao)
    if (minDistance <= 3) {
        return bestMatch;
    }
    return null;
}

async function captureAndAnalyze() {
    if (!isScanning) return;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');

    if (video.videoWidth === 0) return;

    const cropX = video.videoWidth * 0.08;
    const cropY = video.videoHeight * 0.25;
    const cropWidth = video.videoWidth * 0.84;
    const cropHeight = video.videoHeight * 0.50;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
    preprocessCanvas(canvas);

    try {
        const result = await Tesseract.recognize(canvas, 'eng');
        const rawText = result.data.text || '';
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length >= 1);

        if (lines.length > 0) {
            let matchedSize = autoMatchExactSize(lines[0]);
            
            if (matchedSize) {
                document.getElementById('livePreview').innerText = "✅ KHỚP CHUẨN: " + matchedSize;
                document.getElementById('resultBox').value = matchedSize;
                document.getElementById('status').innerText = "🎯 TỰ ĐỘNG BẮT ĐÚNG CỠ! Bấm SAVE để lưu.";
                document.getElementById('status').style.color = "green";
            } else {
                document.getElementById('livePreview').innerText = "👀 Đang dò: " + lines[0];
            }
        }
    } catch (e) {}
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    select.onchange = function() {
        localStorage.setItem('saved_donhang', this.value);
        onDonHangChange();
    };

    onDonHangChange();
}

function onDonHangChange() {
    const donHang = document.getElementById('donHangSelect').value;
    const item = rawStyleData.find(i => i.donHang === donHang);
    
    if (item && item.danhSachCo && item.danhSachCo.length > 0) {
        currentValidSizes = item.danhSachCo;
    } else {
        currentValidSizes = [];
    }
    resetScanState();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    let vanBan = document.getElementById('resultBox').value.trim();
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa bắt được cỡ x giàng chuẩn!"); return; }

    status.innerText = "⏳ Đang lưu dữ liệu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG VỀ SHEET!";
        status.style.color = "green";

        setTimeout(() => {
            resetScanState();
        }, 1000);

    } catch (e) {
        status.innerText = "❌ Lỗi khi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
