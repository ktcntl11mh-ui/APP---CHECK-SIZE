<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Quét Siêu Tốc (Bản Vá Lỗi)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px); padding: 10px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 200px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 8px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute; top: 35%; left: 5%; width: 90%; height: 30%;
            border: 3px solid #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.55);
            border-radius: 6px;
        }
        .live-preview-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-weight: bold;
            font-size: 18px; text-shadow: 1px 1px 3px #000; background: rgba(0,0,0,0.85);
            padding: 6px 4px; min-height: 36px;
        }
        
        /* Soi canvas trực tiếp thay vì render ra Base64 Img để chống tràn RAM */
        .debug-box {
            text-align: center; margin-bottom: 12px; background: #eee; padding: 6px; border-radius: 6px;
        }
        #hiddenCanvas { 
            width: 100%; max-height: 60px; object-fit: contain; border: 1px solid #ccc; background: #fff; display: block; margin: auto;
        }

        .btn-action {
            width: 100%; padding: 15px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-save { background: #28a745; margin-top: 10px; }
        #resultBox {
            width: 100%; height: 55px; padding: 10px; border: 2px solid #28a745;
            border-radius: 8px; font-size: 24px; font-weight: bold; color: #155724; background: #e8f8f5;
            text-align: center;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX --</option>
        </select>
    </div>

    <label>Căn CHỮ CỠ GIÀNG lọt vào KHUNG XANH:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
        <div class="live-preview-text" id="livePreview">⏳ Đang khởi tạo...</div>
    </div>

    <div class="debug-box">
        <small style="font-size:12px; color:#555;">Mắt thần AI đang rọi (Phóng to):</small><br>
        <canvas id="hiddenCanvas"></canvas>
    </div>

    <div class="form-group">
        <label>Cỡ x giàng tự động khớp chuẩn *</label>
        <input type="text" id="resultBox" readonly placeholder="Khớp chuẩn sẽ hiện ở đây...">
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';
let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let currentValidSizes = [];
let isScanning = false;
let isProcessing = false;
let scanInterval = null;
let worker = null;

window.onload = async function() {
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang tải CSDL & Camera...";
    status.style.color = "blue";

    // Khởi tạo tuần tự đúng chuẩn Async/Await
    await initCamera();
    await initTesseractWorkerFast();

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "⚡ Sẵn sàng quét siêu tốc!";
        status.style.color = "green";
        document.getElementById('livePreview').innerText = "⚡ Đưa chữ vào khung xanh";
        
        // Bắt đầu quét sau khi mọi thứ đã sẵn sàng 100%
        startAutoScan();
    } catch (e) {
        status.innerText = "❌ Lỗi kết nối CSDL!";
        status.style.color = "red";
    }
};

async function initTesseractWorkerFast() {
    try {
        worker = await Tesseract.createWorker('eng', 1);
        await worker.setParameters({
            tessedit_ocr_engine_mode: Tesseract.OEM.LSTM_ONLY,
            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK, // PSM 6 giúp quét linh hoạt hơn kể cả khi nghiêng nhẹ
            tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ/- ',
        });
    } catch(e) {
        console.error("Lỗi Worker:", e);
    }
}

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: { ideal: "environment" }, 
                width: { ideal: 1920 }, 
                height: { ideal: 1080 } 
            }, 
            audio: false
        });
        video.srcObject = stream;

        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.zoom) {
            track.applyConstraints({ advanced: [{ zoom: Math.min(2.0, capabilities.zoom.max) }] });
        }
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {}
    }
}

function startAutoScan() {
    isScanning = true;
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(captureAndAnalyze, 250);
}

function resetScanState() {
    document.getElementById('resultBox').value = '';
    document.getElementById('livePreview').innerText = "⚡ Đang chờ quét...";
    document.getElementById('status').innerText = "⚡ Rọi khung xanh vào chữ";
    document.getElementById('status').style.color = "green";
    isScanning = true;
}

function autoMatchExactSize(scannedText) {
    if (!currentValidSizes || currentValidSizes.length === 0) return null;
    let cleanScanned = scannedText.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cleanScanned.length < 1) return null;

    let bestMatch = null;
    let maxScore = 0;

    currentValidSizes.forEach(validSize => {
        let cleanValid = validSize.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let matched = 0;
        for (let char of cleanValid) {
            if (cleanScanned.includes(char)) matched++;
        }
        let score = matched / cleanValid.length;
        if (score > maxScore && score >= 0.45) {
            maxScore = score;
            bestMatch = validSize;
        }
    });

    return bestMatch;
}

async function captureAndAnalyze() {
    if (!isScanning || isProcessing || !worker) return;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');

    // Vá lỗi chiều cao/chiều rộng video chưa sẵn sàng
    if (!video.videoWidth || !video.videoHeight || video.videoWidth < 100) return;

    const cropWidthSource = video.videoWidth * 0.50;  
    const cropHeightSource = video.videoHeight * 0.15; 
    const cropX = Math.max(0, (video.videoWidth - cropWidthSource) / 2);
    const cropY = Math.max(0, (video.videoHeight - cropHeightSource) / 2);

    canvas.width = 300;
    canvas.height = 60;

    // Vẽ trực tiếp lên canvas hiển thị trên UI (không thông qua Image Base64)
    context.drawImage(video, cropX, cropY, cropWidthSource, cropHeightSource, 0, 0, canvas.width, canvas.height);

    isProcessing = true;

    try {
        const res = await worker.recognize(canvas);
        const text = (res.data.text || '').trim();

        if (text.length > 0) {
            let matchedSize = autoMatchExactSize(text);
            
            if (matchedSize) {
                document.getElementById('livePreview').innerText = "✅ KHỚP CHUẨN: " + matchedSize;
                document.getElementById('resultBox').value = matchedSize;
                document.getElementById('status').innerText = "🎯 ĐÃ CHỐT CỠ! Bấm SAVE để lưu.";
                document.getElementById('status').style.color = "green";
                isScanning = false;
            } else {
                document.getElementById('livePreview').innerText = "👀 Rọi thấy: " + text;
            }
        }
    } catch (e) {} finally {
        isProcessing = false;
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    // Vá lỗi: Kích hoạt ngay sự kiện cập nhật danh sách cỡ khi chuyển Mùa
    onDonHangChange();
}

function onDonHangChange() {
    const donHang = document.getElementById('donHangSelect').value;
    localStorage.setItem('saved_donhang', donHang);
    
    const item = rawStyleData.find(i => i.donHang === donHang && i.muaSX === selectedSeason);
    if (item && item.danhSachCo) {
        currentValidSizes = item.danhSachCo;
    } else {
        currentValidSizes = [];
    }
    resetScanState();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    let vanBan = document.getElementById('resultBox').value.trim();
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa bắt được Cỡ x Giàng!"); return; }

    status.innerText = "⏳ Đang lưu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";

        setTimeout(() => {
            resetScanState();
        }, 800);

    } catch (e) {
        status.innerText = "❌ Lỗi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>
</body>
</html>
