<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Quét OCR Cỡ Theo Nhãn Hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px); padding: 12px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 200px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 10px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute; top: 25%; left: 8%; width: 84%; height: 50%;
            border: 3px dashed #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.35);
        }
        .live-preview-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-weight: bold;
            font-size: 20px; text-shadow: 1px 1px 3px #000; background: rgba(0,0,0,0.75);
            padding: 8px 4px; min-height: 40px;
        }
        .size-buttons-list {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; max-height: 150px; overflow-y: auto;
        }
        .btn-size-item {
            padding: 8px 12px; background: #e9ecef; border: 1px solid #007bff;
            border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; color: #007bff;
        }
        .btn-size-item:active { background: #007bff; color: white; }
        .btn-action {
            width: 100%; padding: 15px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-lock { background: #17a2b8; margin-bottom: 12px; }
        .btn-save { background: #28a745; }
        #resultBox {
            width: 100%; height: 60px; padding: 10px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 22px; font-weight: bold; color: #d9534f;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải Mùa SX...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX trước --</option>
        </select>
    </div>

    <label>Rọi camera vào dòng Cỡ x Giàng:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
        <div class="live-preview-text" id="livePreview">👀 Lia camera vào tem...</div>
    </div>

    <button class="btn-action btn-lock" id="lockBtn" onclick="lockCurrentText()">🎯 CHỐT CỠ NÀY</button>

    <div class="form-group">
        <label>Cỡ x giàng chuẩn bị Lưu *</label>
        <textarea id="resultBox" placeholder="Chữ chốt sẽ hiển thị ở đây..." onfocus="pauseScanForEdit()"></textarea>
        
        <label style="font-size: 14px; color: #555; margin-top: 8px;" id="sizeListLabel">Dải cỡ thuộc nhãn hàng (Chạm chọn nhanh):</label>
        <div class="size-buttons-list" id="sizeButtonsList">
            <small style="color:#888;">Chưa chọn đơn hàng</small>
        </div>
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';

let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let currentValidSizes = [];
let isScanning = true;
let scanInterval = null;
let currentDetectedText = "";

window.onload = async function() {
    initCamera();
    startAutoScan();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang kết nối CSDL...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "👀 Camera đang dò cỡ chuẩn...";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi tải CSDL!";
        status.style.color = "red";
    }
};

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {
            document.getElementById('status').innerText = "⚠️ Mở bằng Safari/Chrome để bật Camera!";
            document.getElementById('status').style.color = "orange";
        }
    }
}

function startAutoScan() {
    isScanning = true;
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(captureAndAnalyze, 700);
}

function pauseScanForEdit() {
    isScanning = false;
    if (scanInterval) clearInterval(scanInterval);
    document.getElementById('status').innerText = "✏️ Đang ở chế độ chọn/sửa...";
    document.getElementById('status').style.color = "orange";
}

function lockCurrentText() {
    if (currentDetectedText) {
        document.getElementById('resultBox').value = currentDetectedText;
        document.getElementById('status').innerText = "🎯 Đã chốt cỡ! Bấm SAVE để lưu.";
        document.getElementById('status').style.color = "green";
    } else {
        alert("Chưa dò được cỡ, vui lòng bấm chọn trực tiếp nút bên dưới!");
    }
}

function resetScanState() {
    document.getElementById('resultBox').blur();
    document.getElementById('resultBox').value = '';
    currentDetectedText = "";
    document.getElementById('livePreview').innerText = "👀 Lia camera vào tem...";
    document.getElementById('status').innerText = "👀 Camera đang dò cỡ chuẩn...";
    document.getElementById('status').style.color = "green";
    startAutoScan();
}

function preprocessCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        let v = avg < 135 ? 0 : 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
}

// So sánh chuỗi quét được với danh sách cỡ chuẩn của Nhãn Hàng
function matchBestSize(scannedText) {
    if (!currentValidSizes || currentValidSizes.length === 0) return scannedText;
    
    let cleanScanned = scannedText.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let bestMatch = scannedText;
    let maxScore = -1;

    currentValidSizes.forEach(validSize => {
        let cleanValid = validSize.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let score = 0;
        for (let char of cleanValid) {
            if (cleanScanned.includes(char)) score++;
        }

        if (score > maxScore) {
            maxScore = score;
            bestMatch = validSize;
        }
    });

    return bestMatch;
}

async function captureAndAnalyze() {
    if (!isScanning) return;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');

    if (video.videoWidth === 0) return;

    const cropX = video.videoWidth * 0.08;
    const cropY = video.videoHeight * 0.25;
    const cropWidth = video.videoWidth * 0.84;
    const cropHeight = video.videoHeight * 0.50;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
    preprocessCanvas(canvas);

    try {
        const result = await Tesseract.recognize(canvas, 'eng');
        const rawText = result.data.text || '';
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length >= 1);

        if (lines.length > 0) {
            let matchedSize = matchBestSize(lines[0]);
            currentDetectedText = matchedSize;
            document.getElementById('livePreview').innerText = matchedSize;
        }
    } catch (e) {}
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    select.onchange = function() {
        localStorage.setItem('saved_donhang', this.value);
        onDonHangChange();
    };

    onDonHangChange();
}

function onDonHangChange() {
    const donHang = document.getElementById('donHangSelect').value;
    const item = rawStyleData.find(i => i.donHang === donHang);
    
    const listContainer = document.getElementById('sizeButtonsList');
    const label = document.getElementById('sizeListLabel');
    listContainer.innerHTML = '';

    if (item && item.danhSachCo && item.danhSachCo.length > 0) {
        currentValidSizes = item.danhSachCo;
        label.innerText = `Dải cỡ nhãn [${item.nhanHang}] (Bấm chọn nhanh):`;

        currentValidSizes.forEach(sizeStr => {
            const btn = document.createElement('button');
            btn.className = 'btn-size-item';
            btn.innerText = sizeStr;
            btn.onclick = () => {
                pauseScanForEdit();
                document.getElementById('resultBox').value = sizeStr;
                document.getElementById('status').innerText = "✅ Đã chọn: " + sizeStr;
                document.getElementById('status').style.color = "green";
            };
            listContainer.appendChild(btn);
        });
    } else {
        currentValidSizes = [];
        label.innerText = 'Dải cỡ thuộc nhãn hàng:';
        listContainer.innerHTML = '<small style="color:#888;">Chưa cấu hình dải cỡ cho nhãn hàng này trong DS-SIZE</small>';
    }
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    let vanBan = document.getElementById('resultBox').value.trim();
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa chọn hoặc quét cỡ x giàng!"); return; }

    status.innerText = "⏳ Đang lưu dữ liệu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG VỀ SHEET!";
        status.style.color = "green";

        setTimeout(() => {
            resetScanState();
        }, 1000);

    } catch (e) {
        status.innerText = "❌ Lỗi khi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
