<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Ưu Tiên Xếp Size Chuẩn Lên Đầu</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 4px); padding: 10px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        #camera-container {
            position: relative; width: 100%; height: 240px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 12px;
        }
        video, img#frozenImage {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        img#frozenImage { display: none; }
        
        .scan-guide {
            position: absolute; top: 15%; left: 5%; width: 90%; height: 70%;
            border: 2px dashed #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.35);
        }
        
        .btn-action {
            width: 100%; padding: 14px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-capture { background: #17a2b8; margin-bottom: 10px; }
        .btn-save { background: #28a745; }
        
        #resultSelect {
            border: 2px solid #28a745; background: #e8f5e9; color: #155724;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX --</option>
        </select>
    </div>

    <label>Căn tem vào khung rồi bấm Chụp (Không lưu ảnh nặng):</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="frozenImage" alt="Ảnh đã chụp">
        <div class="scan-guide" id="scanGuide"></div>
    </div>

    <button class="btn-action btn-capture" id="captureBtn" onclick="handleCaptureOrRetake()">📸 CHỤP & ƯU TIÊN SẮP XẾP SIZE</button>

    <div class="form-group">
        <label>Cỡ x Giàng (Đã tự động đẩy dòng chuẩn lên ĐẦU) *</label>
        <!-- Danh sách tự động sắp xếp đưa kết quả khớp nhất lên đầu tiên -->
        <select id="resultSelect">
            <option value="">-- Vui lòng chụp tem để hệ thống sắp xếp --</option>
        </select>
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';
let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let isFrozen = false;

window.onload = async function() {
    initCamera();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang kết nối CSDL...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        
        renderSeasons();
        status.innerText = "👀 Căn tem vào khung và bấm CHỤP!";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi kết nối CSDL!";
        status.style.color = "red";
    }
};

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {}
    }
}

function handleCaptureOrRetake() {
    if (!isFrozen) {
        captureAndProcess();
    } else {
        resetToCamera();
    }
}

function resetToCamera() {
    isFrozen = false;
    document.getElementById('webcam').style.display = 'block';
    document.getElementById('frozenImage').style.display = 'none';
    document.getElementById('scanGuide').style.display = 'block';
    
    const btn = document.getElementById('captureBtn');
    btn.innerText = "📸 CHỤP & ƯU TIÊN SẮP XẾP SIZE";
    btn.style.background = "#17a2b8";
    btn.style.color = "#fff";
    
    updateSizeDropdown(); // Nạp lại danh sách gốc bình thường
    document.getElementById('status').innerText = "👀 Căn tem vào khung và bấm CHỤP";
    document.getElementById('status').style.color = "green";
}

function preprocessCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;
        let v = gray < 130 ? Math.max(0, gray - 20) : Math.min(255, gray + 20);
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
}

// Lấy danh sách size gốc của đơn hàng hiện tại
function getValidSizesForCurrentOrder() {
    const currentDH = document.getElementById('donHangSelect').value;
    const item = rawStyleData.find(d => d.muaSX === selectedSeason && d.donHang === currentDH);
    return item ? (item.danhSachCo || []) : [];
}

// Đổ danh sách bình thường (khi chưa chụp)
function updateSizeDropdown(sortedList = null) {
    const selectRes = document.getElementById('resultSelect');
    selectRes.innerHTML = '';
    const validList = sortedList || getValidSizesForCurrentOrder();
    
    if (validList.length === 0) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.innerText = "-- Không có dữ liệu size --";
        selectRes.appendChild(opt);
        return;
    }

    validList.forEach(size => {
        const opt = document.createElement('option');
        opt.value = size;
        opt.innerText = size;
        selectRes.appendChild(opt);
    });
}

// THUẬT TOÁN THÔNG MINH: Sắp xếp ưu tiên đưa size/giàng khớp nhất lên đầu danh sách
function sortSizesByOCR(ocrText, validList) {
    if (!validList || validList.length === 0) return [];
    
    const cleanOcr = ocrText.replace(/\s+/g, ' ').trim().toUpperCase();
    
    // Tách lấy con số (ví dụ "28/6" -> lấy "28")
    const matchNum = cleanOcr.match(/\d+/);
    const coreNum = matchNum ? matchNum[0] : "";
    
    // Xác định giàng R, S, L từ kết quả OCR
    let targetGiang = "";
    if (cleanOcr.includes("REG") || cleanOcr.includes(" R ")) targetGiang = "REG";
    else if (cleanOcr.includes("SHO") || cleanOcr.includes(" S ")) targetGiang = "SHORT";
    else if (cleanOcr.includes("LON") || cleanOcr.includes(" L ")) targetGiang = "LONG";

    // Chấm điểm từng phần tử trong danh sách chuẩn
    let scoredList = validList.map(item => {
        let itemUp = item.toUpperCase();
        let score = 0;

        // Trùng khớp tuyệt đối 100% -> Điểm cao nhất
        if (itemUp === cleanOcr) score += 100;

        // Trùng số size cốt lõi (Cực kỳ quan trọng)
        if (coreNum && itemUp.includes(coreNum)) score += 50;

        // Trùng giàng R/L/S
        if (targetGiang && itemUp.includes(targetGiang)) score += 30;

        return { name: item, score: score };
    });

    // Sắp xếp giảm dần theo điểm số (Điểm cao nhất sẽ tự động được đẩy lên vị trí số 0 - ĐẦU TIÊN)
    scoredList.sort((a, b) => b.score - a.score);

    return scoredList.map(x => x.name);
}

async function captureAndProcess() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');
    const status = document.getElementById('status');

    if (video.videoWidth === 0) return;

    status.innerText = "⚡ Đang phân tích và sắp xếp danh sách...";
    status.style.color = "blue";

    const cropX = video.videoWidth * 0.05;
    const cropY = video.videoHeight * 0.15;
    const cropWidth = video.videoWidth * 0.90;
    const cropHeight = video.videoHeight * 0.70;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    try {
        context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
        
        const frozenImg = document.getElementById('frozenImage');
        frozenImg.src = canvas.toDataURL('image/png');
        video.style.display = 'none';
        frozenImg.style.display = 'block';
        document.getElementById('scanGuide').style.display = 'none';

        isFrozen = true;
        const btn = document.getElementById('captureBtn');
        btn.innerText = "🔄 CHỤP LẠI";
        btn.style.background = "#ffc107";
        btn.style.color = "#000";

        preprocessCanvas(canvas);

        const result = await Tesseract.recognize(canvas, 'eng');
        
        let linesData = [];
        if (result.data && result.data.lines) {
            result.data.lines.forEach(line => {
                let text = line.text.trim();
                if (text.length >= 2 && line.bbox) {
                    linesData.push({ text: text, topY: line.bbox.y0 });
                }
            });
        }

        let validList = getValidSizesForCurrentOrder();

        if (linesData.length > 0) {
            linesData.sort((a, b) => a.topY - b.topY);
            let topMostLine = linesData[0].text; // Lấy dòng đầu tiên quét được

            // Sắp xếp lại danh sách: Đưa size/giàng phù hợp nhất lên hàng đầu
            let sortedList = sortSizesByOCR(topMostLine, validList);
            updateSizeDropdown(sortedList);

            status.innerText = "✨ Đã xếp size chuẩn lên đầu! Kiểm tra rồi bấm Save.";
            status.style.color = "green";
        } else {
            status.innerText = "⚠️ Không rõ chữ, hãy chọn trực tiếp bên dưới!";
            status.style.color = "orange";
        }

    } catch (e) {
        status.innerText = "❌ Lỗi nhận diện! Vui lòng chọn thủ công.";
        status.style.color = "red";
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))].filter(Boolean);
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))].filter(Boolean);

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    updateSizeDropdown();
}

function onDonHangChange() {
    localStorage.setItem('saved_donhang', document.getElementById('donHangSelect').value);
    resetToCamera();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    const vanBan = document.getElementById('resultSelect').value;
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Vui lòng chọn Cỡ x Giàng!"); return; }

    status.innerText = "⏳ Đang lưu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";

        setTimeout(() => {
            resetToCamera();
        }, 600);

    } catch (e) {
        status.innerText = "❌ Lỗi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>
</body>
</html>
