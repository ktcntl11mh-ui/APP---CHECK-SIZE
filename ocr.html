<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Quét Siêu Tốc < 1s</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 12px; background-color: #f2f4f8; font-size: 18px;
        }
        .card {
            background: white; padding: 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #007bff;
            border-radius: 8px; font-size: 18px; font-weight: bold; background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px); padding: 10px; border: 2px solid #007bff;
            background: white; color: #007bff; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        /* Khung camera tối ưu diện tích hẹp */
        #camera-container {
            position: relative; width: 100%; height: 160px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 12px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute; top: 35%; left: 10%; width: 80%; height: 30%;
            border: 2px solid #00ff00; pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.45);
        }
        .live-preview-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-weight: bold;
            font-size: 20px; text-shadow: 1px 1px 3px #000; background: rgba(0,0,0,0.85);
            padding: 6px 4px; min-height: 38px;
        }
        .btn-action {
            width: 100%; padding: 15px; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .btn-save { background: #28a745; margin-top: 10px; }
        #resultBox {
            width: 100%; height: 55px; padding: 10px; border: 2px solid #28a745;
            border-radius: 8px; font-size: 24px; font-weight: bold; color: #155724; background: #e8f8f5;
            text-align: center;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải...</span>
        </div>
    </div>

    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect" onchange="onDonHangChange()">
            <option value="">-- Chọn Mùa SX --</option>
        </select>
    </div>

    <label>Căn dải Cỡ x Giàng vào ĐÚNG KHUNG XANH:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
        <div class="live-preview-text" id="livePreview">⚡ Đang chờ quét...</div>
    </div>

    <div class="form-group">
        <label>Cỡ x giàng tự động khớp chuẩn *</label>
        <input type="text" id="resultBox" readonly placeholder="Khớp chuẩn sẽ hiện ở đây...">
    </div>

    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDo0P_wZJTAmeYK3Ybvjk5rPlfBW4D8GsyYBjON3t9TyozgmNDLwczG1pa4qShRjH/exec';

let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let currentValidSizes = [];
let isScanning = true;
let isProcessing = false; // Chống chồng hàng chờ OCR
let scanInterval = null;
let worker = null;

window.onload = async function() {
    initCamera();
    initTesseractWorker();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang tải dữ liệu...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "⚡ Sẵn sàng quét siêu tốc!";
        status.style.color = "green";
    } catch (e) {
        status.innerText = "❌ Lỗi kết nối CSDL!";
        status.style.color = "red";
    }
};

// Khởi tạo trước Tesseract Worker để không mất công load lại
async function initTesseractWorker() {
    try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
            tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ/ ',
        });
    } catch(e) {}
}

async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {}
    }
    startAutoScan();
}

function startAutoScan() {
    isScanning = true;
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(captureAndAnalyze, 250); // Quét liên tục mỗi 0.25s
}

function resetScanState() {
    document.getElementById('resultBox').value = '';
    document.getElementById('livePreview').innerText = "⚡ Đang chờ quét...";
    document.getElementById('status').innerText = "⚡ Rọi khung xanh vào chữ trên tem";
    document.getElementById('status').style.color = "green";
    isScanning = true;
}

// Xử lý ảnh siêu tốc: Chỉ giữ lại khung cực hẹp
function preprocessCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        let v = avg < 120 ? 0 : 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
}

function autoMatchExactSize(scannedText) {
    if (!currentValidSizes || currentValidSizes.length === 0) return null;
    let cleanScanned = scannedText.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cleanScanned.length < 2) return null;

    let bestMatch = null;
    let maxMatchChars = 0;

    currentValidSizes.forEach(validSize => {
        let cleanValid = validSize.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let matched = 0;
        for (let char of cleanValid) {
            if (cleanScanned.includes(char)) matched++;
        }
        if (matched > maxMatchChars && (matched / cleanValid.length) >= 0.6) {
            maxMatchChars = matched;
            bestMatch = validSize;
        }
    });

    return bestMatch;
}

async function captureAndAnalyze() {
    if (!isScanning || isProcessing) return;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');

    if (video.videoWidth === 0) return;

    // CẮT SIÊU HẸP ĐÚNG KHUNG XANH (Rút gọn 70% ảnh)
    const cropX = video.videoWidth * 0.10;
    const cropY = video.videoHeight * 0.35;
    const cropWidth = video.videoWidth * 0.80;
    const cropHeight = video.videoHeight * 0.30;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
    preprocessCanvas(canvas);

    isProcessing = true;

    try {
        let text = "";
        if (worker) {
            const res = await worker.recognize(canvas);
            text = res.data.text || '';
        } else {
            const res = await Tesseract.recognize(canvas, 'eng');
            text = res.data.text || '';
        }

        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length >= 2);

        if (lines.length > 0) {
            let matchedSize = autoMatchExactSize(lines[0]);
            
            if (matchedSize) {
                document.getElementById('livePreview').innerText = "✅ KHỚP CHUẨN: " + matchedSize;
                document.getElementById('resultBox').value = matchedSize;
                document.getElementById('status').innerText = "🎯 ĐÃ CHỐT CỠ! Bấm SAVE để lưu.";
                document.getElementById('status').style.color = "green";
                isScanning = false; // Tạm dừng khi đã bắt đúng cỡ chuẩn
            } else {
                document.getElementById('livePreview').innerText = "👀 Đang rọi: " + lines[0];
            }
        }
    } catch (e) {} finally {
        isProcessing = false;
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';
    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';
    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh; opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    select.onchange = function() {
        localStorage.setItem('saved_donhang', this.value);
        onDonHangChange();
    };

    onDonHangChange();
}

function onDonHangChange() {
    const donHang = document.getElementById('donHangSelect').value;
    const item = rawStyleData.find(i => i.donHang === donHang);
    if (item && item.danhSachCo) {
        currentValidSizes = item.danhSachCo;
    } else {
        currentValidSizes = [];
    }
    resetScanState();
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    let vanBan = document.getElementById('resultBox').value.trim();
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa bắt được Cỡ x Giàng!"); return; }

    status.innerText = "⏳ Đang lưu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";

        setTimeout(() => {
            resetScanState();
        }, 800);

    } catch (e) {
        status.innerText = "❌ Lỗi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
